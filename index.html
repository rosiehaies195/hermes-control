<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hermes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#FFD700;--amber:#FFBF00;--claude:#D97757;--codex:#7A9DFF;--ok:#7cc68d;--bad:#ef7b7b;--warn:#e7b85a;--on-gold:#07070d;
 --bg:#07070d;--s1:#0f0f18;--s2:#16162a;--line:#1e1e33;--tx:#e8e4dc;--mut:#9a968e;--dim:#6c6973;--cl-s:#262624;--cl-line:#3d3d3a;--cl-tx:#faf9f5;--cl-mut:#a8a59b}
html[data-theme=light]{--bg:#f6f4ee;--s1:#fff;--s2:#efebe1;--line:#e4ded1;--tx:#1b1a17;--mut:#625d53;--dim:#8f897c;--gold:#8B6508;--amber:#7A5800;--on-gold:#fff;--cl-s:#faf9f5;--cl-line:#e3dfd3;--cl-tx:#1f1e1d;--cl-mut:#6f6b62;--ok:#2f8f4e;--bad:#c94141;--warn:#9a6a00}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;background:#000;color:#e8e4dc;border:1px solid #FFD70055;border-radius:12px;padding:10px 12px;font-size:13px;transform:translateY(30px);opacity:0;pointer-events:none;transition:.25s;word-break:break-word;display:flex;align-items:center;gap:10px}
.toast.on{transform:none;opacity:1;pointer-events:auto}.toast b{color:#FFD700}.toast .tx{flex:1}
.toast a{color:#FFD700;font-weight:700;cursor:pointer;padding:8px 4px;white-space:nowrap}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:#000 url(logo-portrait.png) center 4px/88% no-repeat;border:1px solid #2a2a3a;transition:box-shadow .4s}
.logo[data-st=ok]{box-shadow:0 0 0 1px #FFD70055,0 0 18px -4px #FFD70088}
.logo[data-st=wait]{animation:glowW 1.8s ease-in-out infinite}
.logo[data-st=bad]{animation:glowB 1.2s ease-in-out infinite}
.logo[data-st=pause]{filter:grayscale(1) brightness(.7)}
@keyframes glowW{50%{box-shadow:0 0 0 2px #D97757,0 0 22px 2px #D9775799}}
@keyframes glowB{50%{box-shadow:0 0 0 2px #ef7b7b,0 0 22px 2px #ef7b7b99}}
@media (prefers-reduced-motion:reduce){.logo,.dot.live,.sk{animation:none!important}}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.hd h1{font:700 20px Inter,sans-serif;margin:0;letter-spacing:-.01em}
.hd .st{font:12px "JetBrains Mono",monospace;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hd .r{margin-left:auto;display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);cursor:pointer;font-size:18px;position:relative}
.ib .hdot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.ib .hdot.bad{background:var(--bad)}
.ib.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.live{font:600 10.5px Inter,sans-serif;letter-spacing:.06em;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:6px;padding:1px 5px}
.live.off{color:var(--mut);border-color:var(--line)}
.sec{padding:0 16px;margin-top:18px}
.sh{display:flex;align-items:center;justify-content:space-between;font:600 12px Inter,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:0 2px 8px;min-height:22px}
.sh a{text-transform:none;letter-spacing:0;color:var(--gold);font-weight:500;cursor:pointer;padding:6px 0 6px 10px}
.sh.col{cursor:pointer}.sh.col:before{content:"▾";margin-right:6px;transition:.2s;display:inline-block}.sh.col.shut:before{transform:rotate(-90deg)}
.sh.col>span:first-child{margin-right:auto}
.grp{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}.row .n{font-weight:600;font-size:15px}.row .d{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.tap{cursor:pointer}.tap:active{background:var(--s2)}
.chev{color:var(--dim);font-size:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.wait{background:var(--claude)}.dot.warn{background:var(--warn)}
.dot.live{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,198,141,.5)}70%{box-shadow:0 0 0 7px rgba(124,198,141,0)}100%{box-shadow:0 0 0 0 rgba(124,198,141,0)}}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:var(--s2);border:1px solid var(--line);flex:none;cursor:pointer;transition:.2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:var(--gold);border-color:var(--gold)}.sw.on:after{left:23px;background:var(--on-gold)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg span{min-width:50px;min-height:40px;display:grid;place-items:center;text-align:center;padding:0 12px;border-radius:10px;border:1px solid var(--line);color:var(--mut);font-size:13.5px;cursor:pointer}
.seg span.on{border-color:var(--gold);color:var(--tx);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.seg.full{flex-wrap:nowrap}.seg.full span{flex:1}
input.in,textarea.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:14px;padding:11px 12px;outline:none}
textarea.in{resize:vertical;min-height:96px;line-height:1.4}
.in:focus{border-color:var(--gold)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--claude);color:#fff;font-size:11px;font-weight:700}
.pill{font:600 11.5px Inter,sans-serif;padding:4px 9px;border-radius:20px;background:var(--s2);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.wait{color:var(--claude)}
.ag{flex:none;display:grid;place-items:center;border-radius:10px;width:40px;height:40px}
.ag.claude{background:color-mix(in srgb,var(--claude) 15%,transparent)}
.ag.codex{background:color-mix(in srgb,var(--codex) 15%,transparent)}
.ag.soon{border:1px dashed var(--dim)}
.ag img{width:62%;height:62%}.ag.soon img{filter:grayscale(1);opacity:.45}
.lg{width:1.1em;height:1.1em;vertical-align:-.18em}
.hint{color:var(--dim);font-size:12px;padding:8px 18px 0}
.btn{min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line);color:var(--tx);background:var(--s1);font-family:inherit;text-align:center;padding:0 12px;user-select:none}
.btn.pri{background:var(--gold);color:var(--on-gold);border:0}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:40px;font-size:13px}
.btn.dis{opacity:.4;pointer-events:none}
.alert{margin:6px 16px 0;border-radius:16px;padding:14px;background:color-mix(in srgb,var(--claude) 11%,var(--s1));border:1px solid color-mix(in srgb,var(--claude) 45%,transparent)}
.alert+.alert,.away+.alert,.alert+.away{margin-top:10px}
.alert .k{font:600 12px Inter,sans-serif;color:var(--claude);display:flex;gap:7px;align-items:center}
.alert .k .tm{margin-left:auto;color:var(--mut);font-weight:500}
.alert .q{margin:6px 0 10px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.alert.codex{background:color-mix(in srgb,var(--codex) 10%,var(--s1));border-color:color-mix(in srgb,var(--codex) 45%,transparent)}.alert.codex .k{color:var(--codex)}
.alert.bad{background:color-mix(in srgb,var(--bad) 10%,var(--s1));border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.alert.bad .k{color:var(--bad)}
.alert.pause{background:var(--s1);border-color:var(--line)}.alert.pause .k{color:var(--mut)}
.alert.warn{background:color-mix(in srgb,var(--warn) 9%,var(--s1));border-color:color-mix(in srgb,var(--warn) 40%,transparent);padding:11px 14px}.alert.warn .k{color:var(--warn)}
.alert.warn .q{margin:4px 0 0;font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:10px 12px;min-height:40px;border-radius:10px;border:1px solid color-mix(in srgb,var(--claude) 40%,var(--line));font-size:13.5px;cursor:pointer;background:var(--s1)}
.chips span:active{background:color-mix(in srgb,var(--claude) 20%,transparent)}
.chips span.more{border-style:dashed;color:var(--mut)}
.chips span.rec{border-color:var(--claude);font-weight:600}
.chips.g span{border-color:var(--line)}
.chips.g span.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--tx)}
.chips.sm span{padding:6px 10px;min-height:34px;font-size:12.5px}
.auto{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.auto>span:first-child{flex:1;min-width:0}
.auto .bar{order:3;flex:0 0 100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.auto .bar i{display:block;height:100%;background:var(--claude);transition:width 1s linear}
.auto a{color:var(--tx);font-weight:600;cursor:pointer;padding:8px 0 8px 8px}
.away{margin:6px 16px 0;border-radius:16px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));background:color-mix(in srgb,var(--gold) 5%,var(--s1))}
.away .k{display:flex;justify-content:space-between;align-items:center;font:600 12px Inter,sans-serif;color:var(--gold)}
.away .k span{cursor:pointer;color:var(--mut);padding:4px 8px;font-size:18px;line-height:1}
.away .nums{display:flex;gap:16px;margin-top:6px}
.away .nums div{font-size:12px;color:var(--mut)}.away .nums b{display:block;font:700 18px "JetBrains Mono",monospace;color:var(--tx)}
.now-c{padding:14px}
.now-c .top{display:flex;gap:12px;align-items:center}
.now-c .nm{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.now-c .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.now-c .acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.strip{padding:12px 14px}
.strip .bar{display:flex;height:24px;border-radius:6px;overflow:hidden;gap:1px;cursor:pointer}
.strip .bar i{display:block;height:100%}
.strip .bar i.W{background:var(--ok)}.strip .bar i.I{background:var(--line)}.strip .bar i.N{background:var(--claude)}.strip .bar i.sel{outline:2px solid var(--tx);outline-offset:-2px}
.strip .ax{display:flex;justify-content:space-between;font:11px "JetBrains Mono",monospace;color:var(--dim);margin-top:4px}
.strip .lg2{display:flex;gap:12px;font-size:11.5px;color:var(--mut);margin-top:8px}
.strip .lg2 span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.strip .info{font-size:13px;margin-top:8px;min-height:19px}
.mini{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin-top:8px}
.mini i{display:block;height:100%}.mini i.W{background:var(--ok)}.mini i.I{background:var(--line)}.mini i.N{background:var(--claude)}
.path{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:14px 14px 12px}
.path::-webkit-scrollbar{display:none}
.path .st{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;position:relative;cursor:pointer;min-height:44px}
.path .st:before{content:"";position:absolute;top:6px;left:-32px;width:64px;height:2px;background:color-mix(in srgb,var(--gold) 60%,transparent);z-index:0}
.path .st.first:before{display:none}
.path .st i{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--gold);z-index:1}
.path .st.cur i{background:var(--bg);border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.path .st.sel span{color:var(--gold)}
.path .st span{font:11px "JetBrains Mono",monospace;color:var(--mut);text-align:center;line-height:1.2;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path .st.cur span{color:var(--tx)}
.path .ms{flex:none;font:600 10.5px "JetBrains Mono",monospace;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:6px;padding:2px 6px;margin:0 4px 18px;white-space:nowrap;z-index:1;background:var(--s1)}
.pinfo{padding:0 14px 12px;font-size:13px;color:var(--mut);min-height:19px}
.acts{display:flex;gap:8px;padding:0 16px;margin-top:12px}
.acts .btn{flex:1}
.ring{display:flex;gap:10px;align-items:center;justify-content:center}
.ring svg{width:26px;height:26px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:rgba(0,0,0,.2)}.ring .fg{stroke:var(--on-gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring small{display:block;font:500 11px "JetBrains Mono",monospace;opacity:.75}
.tok{padding:12px 14px}
.tok .top{display:flex;justify-content:space-between;align-items:baseline}
.tok .top b{font:700 20px "JetBrains Mono",monospace}
.tok .top .w{font-size:12px;color:var(--amber)}.tok .top .w.okk{color:var(--ok)}
.tok .bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:10px;position:relative}
.tok .bars i{flex:1;background:color-mix(in srgb,var(--gold) 55%,transparent);border-radius:2px 2px 0 0;min-height:1px}
.tok .bars i.over{background:var(--amber)}
.tok .bars .lim{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);opacity:.7}
.tok .bars .lim span{position:absolute;right:0;top:-15px;font:10px "JetBrains Mono",monospace;color:var(--bad)}
.fc{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--s2);font-size:13px;display:flex;gap:10px;align-items:center}
.fc .g{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.fc .g i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}.fc .g i.p{background:repeating-linear-gradient(90deg,var(--amber) 0 4px,transparent 4px 7px);opacity:.8}
.fc.over{color:var(--amber)}
.feed .row{align-items:flex-start;min-height:0;padding:10px 14px}
.feed .tm{font:12px "JetBrains Mono",monospace;color:var(--dim);width:40px;flex:none;padding-top:1px}
.feed .k{width:18px;flex:none;text-align:center;color:var(--gold);font-size:13px}
.feed .x{flex:1;font-size:13.5px;overflow-wrap:anywhere}
.feed .day{font:600 11.5px Inter,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;background:var(--s2);padding:6px 14px;min-height:0}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.qcard{background:var(--cl-s);border:1px solid var(--cl-line);border-radius:16px;padding:14px;color:var(--cl-tx);font-family:ui-serif,Georgia,serif;margin-bottom:12px}
.qcard.codex{border-color:color-mix(in srgb,var(--codex) 45%,var(--cl-line))}
.qcard .qh{display:flex;align-items:center;gap:8px;font:600 12px Inter,sans-serif;color:var(--claude)}
.qcard.codex .qh{color:var(--codex)}
.qcard .qh .t{margin-left:auto;color:var(--cl-mut);font-weight:500}
.qcard .qs{font:12.5px Inter,sans-serif;color:var(--cl-mut);margin:8px 0 4px}
.qcard .qq{font-size:17px;line-height:1.35;margin-bottom:12px;overflow-wrap:anywhere}
.qcard .ops{border:1px solid var(--cl-line);border-radius:12px;overflow:hidden;font-family:Inter,sans-serif;font-size:14.5px}
.qcard .op{display:flex;gap:11px;align-items:flex-start;padding:12px;min-height:48px;border-top:1px solid var(--cl-line);cursor:pointer}
.qcard .op:first-child{border-top:0}
.qcard .op.on{background:color-mix(in srgb,var(--claude) 10%,transparent)}
.qcard .op small{display:block;color:var(--cl-mut);font-size:12px}
.qcard .rd{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--cl-mut);position:relative}
.qcard .op.on .rd{border-color:var(--claude)}.qcard .op.on .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--claude)}
.qcard input.in{background:var(--cl-s);border-color:var(--cl-line);color:var(--cl-tx);font-family:Inter;margin-top:8px}
.qcard .chips{margin-top:8px}.qcard .chips span{background:var(--cl-s);border-color:var(--cl-line);color:var(--cl-mut);font-family:Inter}
.qcard .qf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;font-family:Inter,sans-serif}
.qb{font:600 14px Inter,sans-serif;border-radius:10px;padding:0 18px;height:44px;cursor:pointer}
.qb.sk{background:none;color:var(--cl-mut);border:1px solid var(--cl-line)}
.qb.sb{background:var(--cl-tx);color:var(--cl-s);border:0}
.qb.al{background:var(--ok);color:#06160b;border:0}.qb.dn{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.qb:disabled{opacity:.35;cursor:default}
.qcard .auto{font-family:Inter,sans-serif;color:var(--cl-mut)}.qcard .auto a{color:var(--cl-tx)}
.perm{font:12.5px "JetBrains Mono",monospace;background:color-mix(in srgb,var(--cl-line) 50%,transparent);border-radius:10px;padding:10px;margin-bottom:10px;overflow-wrap:anywhere;color:var(--cl-tx)}
.reader{padding:6px 18px 10px;font-size:14.5px;overflow-wrap:anywhere}
.reader h1{font-size:20px;margin:12px 0 6px}.reader h2,.reader h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:18px 0 6px}
.reader ul{padding-left:18px;margin:4px 0}.reader li{margin:3px 0}.reader li::marker{color:var(--gold)}.reader p{margin:6px 0}
.reader code{font:12.5px "JetBrains Mono",monospace;background:var(--s2);border-radius:4px;padding:1px 4px}
.reader pre{font:12px "JetBrains Mono",monospace;background:var(--s2);border-radius:8px;padding:8px;overflow-x:auto}
.reader .fm{font:11.5px "JetBrains Mono",monospace;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.snap{display:block;width:100%;border-radius:10px;margin-bottom:12px;border:1px solid var(--cl-line);cursor:zoom-in;min-height:60px;background:var(--cl-line)}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:none;overflow:auto}.viewer.on{display:block}
.viewer img{width:200%;max-width:none;display:block}.viewer span{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:22px;background:#000a;color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tags span{font:11px "JetBrains Mono",monospace;color:var(--mut);background:var(--s2);border-radius:6px;padding:1px 6px}
.now ul{margin:0;padding:12px 14px 12px 30px}.now li{margin-bottom:6px;font-size:14px}.now li::marker{color:var(--gold)}
.snip{font-size:12.5px;color:var(--mut);margin-top:4px;font-family:"JetBrains Mono",monospace;overflow-wrap:anywhere}
.back{display:flex;align-items:center;gap:6px;padding:12px 16px 0;color:var(--gold);font-weight:500;cursor:pointer;min-height:44px}
.ph{display:flex;gap:14px;align-items:center;padding:12px 16px 0}.ph h2{margin:0;font-size:22px;line-height:1.2}.ph .d{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.stats div{background:var(--s1);padding:10px 8px;text-align:center;font-size:11.5px;color:var(--mut)}.stats b{display:block;font:700 17px "JetBrains Mono",monospace;color:var(--tx)}
.empty{padding:28px 20px;text-align:center;color:var(--mut)}
.empty .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:16px}
.sk{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:shim 1.2s infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}
.ptr{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;z-index:30;pointer-events:none;transform:translateY(-50px);transition:transform .2s}
.ptr span{margin-top:8px;width:36px;height:36px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:5}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;position:relative}
.nav div i{font-style:normal;font-size:19px;line-height:1}
.nav div.on{color:var(--gold)}
.nav .badge{position:absolute;top:8px;left:calc(50% + 6px)}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));padding:10px 12px 6px;background:linear-gradient(transparent,var(--bg) 35%);z-index:4}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--s1);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .gr{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet p{margin:0 0 14px;color:var(--mut);font-size:13.5px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-top:1px solid var(--line);cursor:pointer;font-size:15px}
.sheet .opt span{color:var(--mut);font:13px "JetBrains Mono",monospace}
.sheet .btn{width:100%;margin-top:8px}
.hold{position:relative;overflow:hidden;background:var(--bad)!important;color:#fff!important;border:0!important}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.28)}
.hold.go i{width:100%;transition:width 1.2s linear}
.hold span{position:relative}
.tgt{font-size:12.5px;color:var(--mut);background:var(--s2);border-radius:10px;padding:9px 11px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.tplrow{display:flex;gap:8px;align-items:center}.tplrow .in{flex:1}
.x{cursor:pointer;color:var(--dim);font-size:22px;padding:8px 10px;line-height:1}
</style>
</head>
<body>
<div class="ptr" id="ptr"><span>↻</span></div>
<div id="scr"></div>
<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="viewer" id="viewer"><img id="vimg" alt=""><span data-a="unview">×</span></div>
<script>
/* Hermes control v3 (prototype). Data: #z=<deflate-raw base64url JSON> from tv_panel.py, or GET {api}/api/state when the hash has api=.
   Actions: Telegram.WebApp.sendData or POST {api}/api with X-Init-Data. Contract: hermes-brain runbooks/miniapp-panel.md (v1, v2, v3).
   In the prototype stand (prototypes/v3.html) the parent window provides window.parent.__mock {state(), live, api(path), post(obj), log(obj,via)}. */
var tg=window.Telegram&&Telegram.WebApp;
var PAR=null;try{if(window.parent!==window&&window.parent.__mock)PAR=window.parent}catch(e){}
var MOCK=PAR?PAR.__mock:null;
var HP=new URLSearchParams(location.hash.slice(1)),API=MOCK?(MOCK.live?'mock':null):HP.get('api');
if(!MOCK&&API&&tg&&tg.platform&&tg.platform!='unknown'&&!tg.initData)API=null;
var MENU=MOCK?!!MOCK.live:!!(tg&&tg.initData);
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
function LG(id,c){return '<img class="'+(c||'')+'" src="'+(id=='codex'?'codex':'claude')+'.svg" alt="'+id+'">'}
function AN(id){return id=='codex'?'Codex':'Claude'}
function hm(ts){return new Date(ts*1000).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}
function dayName(ts){var d=new Date(ts*1000),n=new Date(),y=new Date(Date.now()-864e5);if(d.toDateString()==n.toDateString())return 'Сегодня';if(d.toDateString()==y.toDateString())return 'Вчера';return d.toLocaleDateString('ru',{day:'numeric',month:'long'})}
function nowS(){return Date.now()/1000}
function ago(ts){var m=Math.max(0,Math.round((nowS()-ts)/60));return m<1?'только что':m<60?m+' мин назад':Math.floor(m/60)+' ч '+(m%60)+' мин назад'}
function dur(min){min=Math.round(min);return min<60?min+' мин':Math.floor(min/60)+' ч'+(min%60?' '+min%60+' мин':'')}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function hl(t,q){t=esc(t);if(!q)return t;return t.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}
var LS={get:function(k,d){try{var v=localStorage.getItem('hc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem('hc_'+k,JSON.stringify(v))}catch(e){}}};
var DEF={quiet:{on:false,from:'23:00',to:'08:00',q:true,fail:true},auto:{on:false,min:15,rule:'rec'},
 tpl:['Продолжай по плану','Сделай как рекомендуешь','Подожди, посмотрю сам','Проверь CI и сделай gh run rerun']};
var S={v:1,ts:0,clicker:{on:false,iv:5},notifier:{on:false},session:'',action:'',fails:0,hang:20,notify:{start:true,question:true,hang:true,fail:true},projects:[],hist:[],log:[],pend:[],brain:{sec:[],now:[],log:[]},budget:6,pause:0,stopped:false,cancel:[],tl:null,tok:null,steps:[],away:null};
var E,LOADING=true,U={tab:'home',page:null,qsel:{},bq:'',bfull:false,grep:null,seg:-1,step:-1,jt:'sess',jf:'all',jq:'',haptics:LS.get('hap',true),col:LS.get('col',{}),say:{t:'',ag:'claude'},nowEd:null};
function norm(){S.quiet=Object.assign({},DEF.quiet,S.quiet||{});S.auto=Object.assign({},DEF.auto,S.auto||{});
 ['pend','hist','log','steps','cancel','projects','sess','health','cj','hs'].forEach(function(k){S[k]=S[k]||[]});S.brain=S.brain||{sec:[],now:[],log:[]};S.budget=S.budget||6;
 S.clicker=S.clicker||{on:false,iv:5};S.notifier=S.notifier||{on:false};S.tpl=S.tpl||DEF.tpl.slice();S.warn=S.warn==null?80:S.warn;
 S.agents=S.agents||[{id:'claude',on:true},{id:'codex',on:false}];
 E={clicker:{on:S.clicker.on,iv:S.clicker.iv},notifier:{on:S.notifier.on},hang:S.hang,notify:Object.assign({},S.notify),projects:JSON.parse(JSON.stringify(S.projects)),quiet:Object.assign({},S.quiet),auto:Object.assign({},S.auto),budget:S.budget,tpl:S.tpl.slice(),warn:S.warn}}
norm();
function SET(x){return {clicker:x.clicker.on,notifier:x.notifier.on,interval:x.clicker.iv,hang:x.hang,notify:x.notify,projects:x.projects,quiet:x.quiet,auto:x.auto,budget:x.budget,tpl:x.tpl,warn:x.warn}}
function dirty(){return JSON.stringify(SET(E))!=JSON.stringify(SET(S))}
function agOn(id){return S.agents.some(function(a){return a.id==id&&a.on})}

/* ---------- связь ---------- */
var tt;
function toast(h,undo){$('toast').innerHTML='<span class="tx">'+h+'</span>'+(undo?'<a data-a="undo">Отменить</a>':'');U.undo=undo||null;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('on');U.undo=null},undo?6000:2800)}
function haptic(k){if(!U.haptics)return;try{k=='sel'?tg.HapticFeedback.selectionChanged():tg.HapticFeedback.notificationOccurred(k)}catch(e){}}
function inTG(){return !!(tg&&tg.platform&&tg.platform!='unknown')}
var UNDO={pause:{a:'resume'},stop:{a:'resume'}};
function send(o,quiet){o=Object.assign({v:1},o);haptic('success');var undo=UNDO[o.a]||null;
 if(API){var p=MOCK?MOCK.post(o):fetch(API.replace(/\/$/,'')+'/api',{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:JSON.stringify(o)}).then(function(r){if(!r.ok)throw r;return r.json()});
  if(MOCK)MOCK.log(o,'POST /api');
  p.then(function(r){if(!quiet)toast('<b>✓</b> '+esc(r.text||'Готово'),undo);if(r.state){S=r.state;norm();if(o.a=='ans')U.qsel={};render(true)}})
  .catch(function(){if(MENU&&!HP.get('z'))toast('Сервер на ПК недоступен. Открой панель кнопкой «Панель» внизу чата — она работает через бота.');else{toast('Сервер недоступен — отправляю через бота');sd(o)}});return}
 sd(o)}
function api(path){if(MOCK)return MOCK.api(path);return fetch(API.replace(/\/$/,'')+path,{headers:{'X-Init-Data':tg?tg.initData:''}}).then(function(r){if(!r.ok)throw r;return r})}
var SNAP={};
function loadSnap(){if(!API||SNAP.busy||(SNAP.t&&Date.now()-SNAP.t<60000))return;SNAP.busy=1;api('/api/snap').then(function(r){return r.blob()}).then(function(b){if(SNAP.url)URL.revokeObjectURL(SNAP.url);SNAP={url:URL.createObjectURL(b),t:Date.now()};render(true)}).catch(function(){SNAP={t:Date.now(),none:1}})}
function busy(){return $('sheet').classList.contains('on')||dirty()||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)}
function poll(force){if(!API||(!force&&(document.hidden||busy())))return Promise.resolve();return api('/api/state').then(function(r){return r.json()}).then(function(d){var a=JSON.stringify(S);S=d;norm();U.offline=0;if(force||JSON.stringify(S)!=a)render(true)}).catch(function(){U.offline=1;render(true)})}
function sd(o){var s=JSON.stringify(o);window.__sent=(window.__sent||[]).concat([s]);if(MOCK){MOCK.log(o,'sendData');toast('<b>sendData</b> → бот. Панель закроется, бот ответит в чате.')}else if(inTG())tg.sendData(s);else toast('<b>sendData</b> (вне Telegram): '+esc(s.slice(0,140)))}
function refresh(){if(API){var b=document.querySelector('[data-a=refresh]');if(b)b.classList.add('spin');poll(true).then(function(){toast('<b>✓</b> Обновлено')})}else send({a:'refresh'})}

/* ---------- статус ---------- */
function paused(){return S.pause>nowS()}
function sessState(){var m=(S.session||'').match(/^(.*?):\s*(Working|Idle|Needs input)\s*$/);return m?{name:m[1],st:m[2]}:{name:S.session||'—',st:''}}
function age(){return S.ts?(nowS()-S.ts)/60:0}
function stale(){return !API&&age()>10}
function hBad(){return S.health.filter(function(h){return !h.ok})}
function status(){
 if(S.stopped)return {c:'bad',t:'Всё остановлено',lg:'bad'};
 if(paused())return {c:'',t:'Пауза до '+hm(S.pause),lg:'pause'};
 if(S.fails)return {c:'bad',t:'Сбой ×'+S.fails,lg:'bad'};
 if(S.pend.length)return {c:'wait',t:'Ждёт ответа',lg:'wait'};
 if(!S.clicker.on)return {c:'',t:'Кликер выключен',lg:'pause'};
 return {c:'ok',t:'Работает',lg:'ok'}}
function hd(){var st=status(),hb=hBad().length;
 var fr=API?(U.offline?'<span class="live off">НЕТ СВЯЗИ</span>':'<span class="live">LIVE</span>'):(S.ts?'<span style="color:'+(stale()?'var(--warn)':'inherit')+'">данные '+ago(S.ts)+'</span>':'');
 return '<div class="hd"><div class="logo" data-st="'+st.lg+'"></div><div><h1>Hermes</h1><div class="st"><span class="dot '+(st.c=='ok'?'live':st.c)+'"></span>'+st.t.toLowerCase()+' · '+fr+'</div></div><div class="r">'+
 (S.health.length?'<div class="ib" data-a="sys" title="Система">⛭<span class="hdot'+(hb?' bad':'')+'"></span></div>':'')+'<div class="ib" data-a="refresh" title="Обновить">↻</div></div></div>'}
function skeleton(){return '<div class="hd"><div class="logo"></div><div style="flex:1"><div class="sk" style="height:18px;width:110px"></div><div class="sk" style="height:12px;width:170px;margin-top:8px"></div></div></div>'+
 [92,150,64,120].map(function(h){return '<div class="sec"><div class="sk" style="height:'+h+'px;border-radius:16px"></div></div>'}).join('')}

/* ---------- главная ---------- */
function deadline(q){return q.ts+S.auto.min*60}
function autoLine(q){
 if(S.cancel.indexOf(q.id)>=0)return '<div class="auto">Автоответ отменён для этого вопроса</div>';
 if(!S.auto.on||q.perm||S.stopped||paused()||!(q.rec>=0||S.auto.rule=='first'))return '';
 var lbl=q.rec>=0?q.o[q.rec]:q.o[0],left=Math.max(0,deadline(q)-nowS()),tot=S.auto.min*60;
 return '<div class="auto" data-auto="'+q.id+'"><span>Автоответ «'+esc(lbl.length>22?lbl.slice(0,21)+'…':lbl)+'» <b class="mono">'+(left>0?'через '+fmt(left):'в ближайшие 5 мин')+'</b></span><span class="bar"><i style="width:'+(100-left/tot*100)+'%"></i></span><a data-a="autocancel" data-x="'+q.id+'">Отменить</a></div>'}
function alerts(){var h='';
 if(U.offline&&API)h+='<div class="alert warn"><div class="k">⚠ Нет связи с ПК · показаны данные '+(S.ts?ago(S.ts):'')+'</div><div class="q">Повторяю каждые 15 с. Если ПК выключен — действия не дойдут.</div></div>';
 else if(stale())h+='<div class="alert warn tap" data-a="refresh"><div class="k">⏱ Данные '+ago(S.ts)+'<span class="tm" style="color:var(--warn)">обновить ›</span></div><div class="q">Кнопка «Панель» хранит снимок на момент отправки. Live-версия — кнопка меню «Hermes».</div></div>';
 if(S.stopped)h+='<div class="alert bad"><div class="k">■ Всё остановлено</div><div class="q">Кликер, уведомления и автоответ выключены. Claude продолжит текущий шаг сам, но без Start и ответов из Telegram.</div><div class="btn pri" data-a="resume" style="min-height:44px">Запустить снова</div></div>';
 else if(paused())h+='<div class="alert pause"><div class="k">⏸ Пауза до '+hm(S.pause)+'</div><div class="q">Кликер не трогает Claude. Вопросы по-прежнему приходят.</div><div class="btn" data-a="resume" style="min-height:44px">Снять паузу</div></div>';
 S.pend.forEach(function(q){var ag=q.ag||'claude';
  h+='<div class="alert '+(ag=='codex'?'codex':'')+'"><div class="k">'+LG(ag,'lg')+' '+AN(ag)+(q.perm?' просит разрешение':' спрашивает')+'<span class="tm">'+(q.ts?ago(q.ts):'')+'</span></div><div class="q">'+esc(q.q)+'</div>'+
  (q.perm?'<div class="chips"><span data-a="quick" data-q="'+q.id+'" data-x="0" style="border-color:var(--ok)">✓ '+esc(q.o[0])+'</span><span data-a="quick" data-q="'+q.id+'" data-x="1" style="border-color:var(--bad)">✕ '+esc(q.o[1])+'</span><span class="more" data-a="openq" data-q="'+q.id+'">Подробнее…</span></div>':
  '<div class="chips">'+q.o.map(function(o,i){return '<span class="'+(i===q.rec?'rec':'')+'" data-a="quick" data-q="'+q.id+'" data-x="'+i+'">'+esc(o)+'</span>'}).join('')+'<span class="more" data-a="openq" data-q="'+q.id+'">Другое…</span></div>')+autoLine(q)+'</div>'});
 if(S.fails&&!S.stopped){var f=S.log.filter(function(e){return e.k=='fail'})[0];h+='<div class="alert bad"><div class="k">✕ Сбой ×'+S.fails+(f?' · '+f.t:'')+'</div><div class="q">'+esc(f?f.x:'Кликер не смог выполнить действие')+'</div><div class="chips"><span data-a="run">Проверить сейчас</span><span data-a="restore">Развернуть окно Claude</span><span data-a="sys">Система ›</span></div></div>'}
 else if(hBad().length&&!S.stopped){var b=hBad();h+='<div class="alert bad tap" data-a="sys"><div class="k">✕ Система: '+b.map(function(x){return esc(x.n)}).join(', ')+'<span class="tm">открыть ›</span></div><div class="q" style="font-size:13px;color:var(--mut);margin:4px 0 0">'+esc(b[0].d)+'</div></div>'}
 return h}
function awayCard(){var A=S.away;if(!A||LS.get('awayHide',0)>=A.since)return '';if(!(A.steps+A.ans+A.fails+A.q))return '';
 return '<div class="away"><div class="k">Пока тебя не было · с '+hm(A.since)+'<span data-a="noaway">×</span></div><div class="nums"><div><b>'+A.steps+'</b>шагов</div><div><b>'+A.q+'</b>вопросов</div><div><b>'+A.ans+'</b>ответов</div><div><b>'+A.fails+'</b>сбоев</div></div></div>'}
function nowCard(){var ss=sessState(),st=status(),idle=ss.st=='Idle'||!ss.st,act=!S.stopped;
 var cur=S.steps.length?S.steps[S.steps.length-1]:null;
 return '<div class="sec"><div class="sh"><span>Сейчас</span></div><div class="grp"><div class="now-c"><div class="top"><span class="ag claude">'+LG('claude')+'</span><div style="flex:1;min-width:0"><div class="nm">'+esc(ss.name)+'</div><div class="sub">'+(ss.st?ss.st+' · ':'')+(cur?'шаг '+esc(cur.c)+' с '+hm(cur.t):'')+'</div></div><span class="pill '+st.c+'">'+(ss.st=='Working'?'работает':ss.st=='Idle'?'простой':ss.st?'ждёт':'—')+'</span></div>'+
 '<div class="acts2"><div class="btn sm'+(act?'':' dis')+'" data-a="startsheet">▶ Start сейчас</div><div class="btn sm'+(act?'':' dis')+'" data-a="saysheet" data-x="claude">✎ Написать</div></div></div>'+
 agentsRows()+'</div></div>'}
function agentsRows(){return S.agents.filter(function(a){return a.id!='claude'}).map(function(a){var q=S.pend.filter(function(x){return (x.ag||'claude')==a.id}).length;
  return '<div class="row tap" data-a="agent" data-x="'+a.id+'"><span class="ag '+(a.on?a.id:'soon')+'">'+LG(a.id)+'</span><div class="t"><div class="n">'+AN(a.id)+'</div><div class="d">'+(a.on?esc(a.sess||'—'):'подключим следующим')+'</div></div>'+(a.on?(q?'<span class="pill wait">ждёт ответа</span>':'<span class="pill ok">'+esc(a.st||'работает')+'</span>'):'<span class="pill">скоро</span>')+'<span class="chev">›</span></div>'}).join('')+
 '<div class="row tap" data-a="agent" data-x="claude"><div class="t"><div class="d">Проекты, интервал, порог зависания Claude</div></div><span class="chev">›</span></div>'}
function segs(tl,ts){tl=tl||S.tl;if(!tl||!tl.seg)return [];var out=[],c=null,end=Math.round((Math.max(ts||S.ts||0,tl.start)-tl.start)/60);
 tl.seg.forEach(function(s){if(c&&c.s==s[1])return;if(c)c.e=s[0];c={b:s[0],s:s[1]};out.push(c)});if(c)c.e=Math.max(end,c.b+1);return out.filter(function(x){return x.e>x.b})}
function strip(){var G=segs();if(!G.length)return '<div class="strip" style="color:var(--mut);font-size:13px">Журнал пуст</div>';
 var N={W:'Working',I:'Idle',N:'Ждал ответа'},sel=G[U.seg],t0=S.tl.start,span=G[G.length-1].e;
 var sum=function(k){return G.filter(function(g){return g.s==k}).reduce(function(a,g){return a+g.e-g.b},0)};
 var ax=[0,.25,.5,.75,1].map(function(f){return '<span>'+hm(t0+f*span*60)+'</span>'}).join('');
 return '<div class="strip"><div class="bar">'+G.map(function(g,i){return '<i class="'+g.s+(i==U.seg?' sel':'')+'" data-a="seg" data-x="'+i+'" style="flex:'+(g.e-g.b)+'"></i>'}).join('')+'</div><div class="ax">'+ax+'</div>'+
 '<div class="info">'+(sel?'<b class="mono">'+hm(t0+sel.b*60)+'–'+hm(t0+sel.e*60)+'</b> · '+N[sel.s]+' · '+dur(sel.e-sel.b):'<span style="color:var(--mut)">Работал '+(sum('W')/60).toFixed(1)+' ч, ждал ответа '+(sum('N')/60).toFixed(1)+' ч. Нажми на отрезок.</span>')+'</div>'+
 '<div class="lg2"><span style="--c:var(--ok)">Working</span><span style="--c:var(--line)">Idle</span><span style="--c:var(--claude)">Ждал ответа</span></div></div>'}

function inflate(b64){var s=b64.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

 return new Promise(function(res,rej){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js';sc.onload=function(){res(pako.inflateRaw(u,{to:'string'}))};sc.onerror=rej;document.head.appendChild(sc)})}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
